<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Lowkey Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Original browser games: arcade, action, puzzle, strategy, sports and word games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Unbounded:wght@500;700;900&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: one dark screen. Slim header, a one-line intro with the filters beside it, then a dense
     grid of game tiles where the cover art does the talking; a game opens into a stage with a side panel.
     Deliberately single-theme (dark), like a console menu. */
  :root {
    --bg: #0A0C14;
    --surface: #131726;
    --surface-2: #1A2033;
    --line: #252C42;
    --fg: #EEF1F8;
    --fg-soft: #8F99B3;
    --accent: #B69CFF;
    --accent-ink: #140B2E;
    --hot: #FF6E9A;
    --focus: #8FD3FF;
    --stage: #05070D;
    --font-display: "Unbounded", "Bungee", "Impact", sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(182, 156, 255, .12), transparent 60%),
      radial-gradient(900px 400px at 100% 0%, rgba(255, 110, 154, .07), transparent 60%),
      var(--bg);
    background-color: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100%;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .app {
    max-width: 1280px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 18px 32px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .logo {
    display: inline-flex; align-items: baseline; gap: 2px;
    color: var(--fg); text-decoration: none;
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(20px, 2.6vw, 26px); line-height: 1; letter-spacing: -0.02em;
    text-transform: lowercase;
  }
  .logo .dot { color: var(--accent); }

  /* Buttons */
  .btn {
    font: 600 15px/1 var(--font-body);
    padding: 11px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background-color .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); border-color: #39425E; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn-primary:hover { background: #C9B6FF; border-color: #C9B6FF; }
  .btn svg { width: 18px; height: 18px; flex: none; }

  /* Library */
  .library-inner { display: grid; gap: 22px; }
  .intro { display: flex; align-items: end; justify-content: space-between; gap: 18px 24px; flex-wrap: wrap; }
  .intro-copy { display: grid; gap: 8px; min-width: 0; }
  .intro h1 {
    margin: 0;
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(26px, 4vw, 44px); line-height: 1.05; letter-spacing: -0.03em;
    text-wrap: balance;
  }
  .intro h1 em { font-style: normal; color: var(--accent); }
  .intro p { margin: 0; color: var(--fg-soft); font-size: 16px; max-width: 60ch; }
  .intro-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search input {
    font: 500 15px var(--font-body);
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--fg);
    width: min(260px, 100%);
  }
  .search input::placeholder { color: var(--fg-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 600 13px/1 var(--font-body);
    padding: 9px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--fg-soft);
    cursor: pointer;
  }
  .chip:hover { color: var(--fg); border-color: #39425E; }
  .chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  .shelves { display: grid; gap: 30px; }
  .shelf { display: grid; gap: 12px; }
  .shelf-title {
    margin: 0;
    font: 700 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--fg-soft);
  }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 960px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .grid, .grid-4 { grid-template-columns: minmax(0, 1fr); } }
  .card {
    display: flex; flex-direction: column;
    color: inherit; text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    min-width: 0;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: rgba(182, 156, 255, .55);
    box-shadow: 0 14px 40px -12px rgba(182, 156, 255, .35);
  }
  .card:focus-visible { outline-offset: 3px; }
  .thumb { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--stage); overflow: hidden; }
  .thumb canvas { display: block; width: 100%; height: 100%; transition: transform .35s ease; }
  .card:hover .thumb canvas { transform: scale(1.04); }
  .thumb::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 40%;
    background: linear-gradient(transparent, rgba(19, 23, 38, .85));
    pointer-events: none;
  }
  .sticker {
    position: absolute; z-index: 1; top: 10px; left: 10px;
    font: 700 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
    background: rgba(5, 7, 13, .72); color: var(--fg);
    border: 1px solid rgba(255, 255, 255, .14);
    padding: 6px 8px; border-radius: 6px;
    backdrop-filter: blur(4px);
  }
  .sticker-net { left: auto; right: 10px; display: inline-flex; align-items: center; gap: 6px; }
  .sticker-net::before, .net-dot { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: #4BE3A0; box-shadow: 0 0 0 3px rgba(75, 227, 160, .18); }
  .card-body { display: grid; gap: 6px; padding: 12px 14px 14px; }
  .card h3 { margin: 0; font: 700 18px/1.2 var(--font-display); letter-spacing: -0.02em; }
  .card p { margin: 0; color: var(--fg-soft); font-size: 14.5px; }
  .meta {
    display: flex; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap;
    font: 500 12.5px var(--font-mono); color: var(--fg-soft);
    padding-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .meta .best-chip.has { color: var(--accent); font-weight: 700; }
  .empty { margin: 0; color: var(--fg-soft); font-size: 16px; }

  /* Player */
  .player { display: grid; gap: 16px; }
  .player-bar { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .player-bar h2 {
    margin: 0;
    font-family: var(--font-display); font-weight: 700;
    font-size: clamp(20px, 2.6vw, 28px); line-height: 1.05; letter-spacing: -0.02em;
  }
  .tag {
    font: 700 11px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(182, 156, 255, .4);
    padding: 6px 8px; border-radius: 6px;
  }
  .player-body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  .stage {
    position: relative;
    width: min(100%, calc((100vh - 130px) * 1.6));
    width: min(100%, calc((100dvh - 130px) * 1.6));
    aspect-ratio: 16 / 10;
    max-width: 100%;
    margin-inline: auto;
    background: var(--stage);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px -20px rgba(0, 0, 0, .8);
  }
  .stage .root { position: absolute; inset: 0; }
  .stage:fullscreen { width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; box-shadow: none; }
  .stage.pseudo-fs {
    position: fixed; inset: 0; z-index: 100;
    width: auto; aspect-ratio: auto; max-width: none;
    border: 0; border-radius: 0; box-shadow: none;
  }
  .fs-exit {
    position: absolute; z-index: 2;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
    font: 600 13px/1 var(--font-body);
    padding: 9px 12px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .3);
    background: rgba(8, 12, 22, .7); color: #fff;
    cursor: pointer;
  }
  .stage-error {
    position: absolute; inset: 0;
    display: grid; place-content: center; gap: 8px;
    padding: 24px; text-align: center;
    color: #C9D3E3; font-size: 16px;
  }
  .stage-error strong { color: #fff; font-size: 18px; }

  .side {
    display: grid; gap: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    min-width: 0;
  }
  .side p { margin: 0; color: var(--fg-soft); }
  .side .net-line { display: flex; align-items: baseline; gap: 10px; padding: 11px 13px; border-radius: 10px; border: 1px solid rgba(75, 227, 160, .28); background: rgba(75, 227, 160, .06); font-size: 14.5px; }
  .net-line strong { color: var(--fg); }
  .side h3 {
    margin: 0 0 10px;
    font: 700 11.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase;
    color: var(--fg-soft);
  }
  .best-box { display: grid; gap: 6px; padding: 14px; border-radius: 10px; background: var(--surface-2); }
  .best-box .label { font: 700 11.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-soft); }
  .best-box .num { font: 700 32px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .best-box .num.flash { animation: flash 1.2s ease; }
  @keyframes flash { 0%, 40% { color: var(--hot); } 100% { color: var(--fg); } }
  .side-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .controls { display: grid; grid-template-columns: auto 1fr; gap: 9px 12px; margin: 0; align-items: baseline; }
  .controls dt { margin: 0; }
  .controls dd { margin: 0; color: var(--fg-soft); font-size: 14.5px; }
  kbd {
    display: inline-block;
    font: 700 12px/1.2 var(--font-mono);
    padding: 4px 7px;
    border-radius: 6px;
    border: 1px solid var(--line);
    border-bottom-width: 3px;
    background: var(--surface-2);
    color: var(--fg);
    white-space: nowrap;
  }
  .next-list { display: grid; gap: 8px; }
  .next-link {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line);
    color: var(--fg); text-decoration: none; font-weight: 700;
  }
  .next-link span { font: 500 11.5px var(--font-mono); color: var(--fg-soft); text-transform: uppercase; letter-spacing: .06em; }
  .next-link:hover { border-color: rgba(182, 156, 255, .55); }

  footer {
    border-top: 1px solid var(--line);
    padding-top: 16px;
    color: var(--fg-soft);
    font-size: 13.5px;
    display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: space-between;
  }

  /* Online lobby: drawn by the hub over the stage, or over the whole viewport when the stage is small */
  .net-ov { position: absolute; inset: 0; z-index: 20; display: flex; padding: 14px; overflow: auto; overscroll-behavior: contain; background: rgba(5, 7, 13, .76); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--fg); font: 400 15px/1.45 var(--font-body); text-align: left; animation: net-in .16s ease-out; }
  .net-ov.net-fixed { position: fixed; z-index: 300; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .net-panel { margin: auto; width: min(540px, 100%); display: grid; gap: 16px; padding: 18px 20px 20px; background: linear-gradient(rgba(182, 156, 255, .07), transparent 140px), var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 30px 80px -24px #000; }
  .net-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .net-head-text, .net-body, .net-field { display: grid; gap: 7px; min-width: 0; }
  .net-body { gap: 14px; }
  .net-kicker, .net-label, .net-tag { font: 700 11px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); overflow-wrap: anywhere; }
  .net-title { margin: 0; font: 700 21px/1.15 var(--font-display); letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .net-x { flex: none; width: 40px; height: 40px; margin: -6px -8px 0 0; padding: 0; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--fg-soft); font: 400 26px/1 var(--font-body); cursor: pointer; }
  .net-x:hover { color: var(--fg); background: var(--surface-2); border-color: var(--line); }
  .net-label { display: flex; justify-content: space-between; gap: 10px; color: var(--fg-soft); margin-bottom: -6px; }
  .net-field .net-label { margin: 0; }
  .net-opt, .net-count { opacity: .8; font-variant-numeric: tabular-nums; }
  .net-input, .net-cell { width: 100%; min-width: 0; min-height: 44px; padding: 10px 13px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 600 16px var(--font-body); }
  .net-input:focus, input.net-cell:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(182, 156, 255, .28); }
  .net-hint, .net-sub, .net-note, .net-err, .net-msg { margin: 0; color: var(--fg-soft); font-size: 13.5px; }
  .net-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .net-choice { display: grid; gap: 3px; align-content: start; text-align: left; padding: 14px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font: inherit; font-size: 13.5px; cursor: pointer; }
  .net-choice strong { font-size: 16px; }
  .net-choice span { color: var(--fg-soft); }
  .net-choice:hover { border-color: rgba(182, 156, 255, .55); }
  .net-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .net-primary:hover { background: #C9B6FF; border-color: #C9B6FF; }
  .net-primary span { color: rgba(20, 11, 46, .72); }
  .net-note { padding: 10px 12px; border-radius: 4px 10px 10px 4px; border-left: 3px solid var(--accent); background: rgba(182, 156, 255, .06); }
  .net-msg { color: var(--fg); font-size: 15.5px; }
  .net-err { color: #FF8FB0; font-weight: 600; }
  .net-url { font: 700 14px var(--font-mono); color: var(--accent); overflow-wrap: anywhere; -webkit-user-select: all; user-select: all; }
  .net-code { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .net-cell { height: 62px; padding: 0; display: grid; place-items: center; text-align: center; font: 700 30px var(--font-mono); text-transform: uppercase; border-radius: 12px; caret-color: var(--accent); }
  .net-code-show .net-cell { color: var(--accent); background: rgba(182, 156, 255, .08); border-color: rgba(182, 156, 255, .32); -webkit-user-select: all; user-select: all; }
  .net-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .net-p { display: flex; align-items: center; gap: 9px; min-width: 0; min-height: 44px; padding: 6px 8px 6px 6px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .net-badge { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: rgba(182, 156, 255, .16); color: var(--accent); font: 700 12px/1 var(--font-mono); }
  .net-name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .net-tag { flex: none; font-size: 10px; color: var(--fg-soft); }
  .net-you { color: var(--accent); }
  .net-ping { flex: none; font: 600 12px var(--font-mono); color: #4BE3A0; }
  .net-mid { color: #FFC93C; }
  .net-bad { color: var(--hot); }
  .net-kick { flex: none; min-height: 32px; padding: 0 6px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--fg-soft); font: 600 12.5px var(--font-body); cursor: pointer; }
  .net-kick:hover { color: var(--hot); border-color: rgba(255, 110, 154, .4); }
  .net-busy { display: flex; align-items: center; gap: 12px; }
  .net-busy .net-sub { color: var(--fg); font-size: 15px; }
  .net-spin { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(182, 156, 255, .25); border-top-color: var(--accent); animation: net-spin .8s linear infinite; }
  .net-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .net-actions .btn { min-height: 44px; min-width: 112px; }
  .net-ov .btn[disabled] { opacity: .42; cursor: not-allowed; pointer-events: none; }
  @keyframes net-spin { to { transform: rotate(360deg); } }
  @keyframes net-in { from { opacity: 0; } }
  @media (max-width: 440px) {
    .net-panel { padding: 16px; }
    .net-choices { grid-template-columns: minmax(0, 1fr); }
    .net-cell { height: 54px; font-size: 26px; }
    .net-actions .btn { flex: 1 1 0; min-width: 0; }
  }

  @media (max-width: 900px) {
    .player-body { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 480px) {
    .side-actions { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn, .card, .thumb canvas { transition: none; }
    .card:hover, .card:focus-visible { transform: none; }
    .card:hover .thumb canvas { transform: none; }
    .best-box .num.flash { animation: none; }
    .net-ov { animation: none; }
    .net-spin { animation-duration: 2.4s; }
  }
</style>

<div class="app">
  <header class="top">
    <a class="logo" href="#" id="home-link" aria-label="Lowkey Arcade home">lowkey<span class="dot">.</span>arcade</a>
    <button id="sound-btn" class="btn" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="cross" d="M16 9l6 6M22 9l-6 6" hidden/></svg>
      <span id="sound-label">Sound on</span>
    </button>
  </header>

  <main id="library" class="library">
    <div class="library-inner">
      <section class="intro" aria-labelledby="intro-title">
        <div class="intro-copy">
          <h1 id="intro-title">9 games. <em>No downloads.</em></h1>
          <p id="intro-text">Everything runs in your browser. No accounts. Your best scores stay on this device.</p>
        </div>
        <div class="intro-actions">
          <button id="random-btn" class="btn btn-primary" type="button">Play something random</button>
        </div>
      </section>
      <div class="filters">
        <label class="search" for="search">
          <span class="sr-only">Search games</span>
          <input id="search" type="search" placeholder="Search  ( / )" autocomplete="off" spellcheck="false">
        </label>
        <div class="chips" id="chips" role="group" aria-label="Filter by genre"></div>
      </div>
      <div class="shelves" id="shelves"></div>
      <p class="empty" id="empty" hidden></p>
    </div>
  </main>

  <section id="player" class="player" hidden aria-labelledby="p-title">
    <div class="player-bar">
      <button id="back-btn" class="btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        All games
      </button>
      <h2 id="p-title"></h2>
      <span class="tag" id="p-genre"></span>
    </div>
    <div class="player-body">
      <div class="stage" id="stage"></div>
      <aside class="side">
        <p id="p-blurb"></p>
        <p class="net-line" id="p-net" hidden><span class="net-dot" aria-hidden="true"></span><span><strong>Online play</strong> <span id="p-net-text"></span></span></p>
        <div class="best-box">
          <span class="label" id="p-best-label">Your best</span>
          <span class="num" id="p-best">None yet</span>
        </div>
        <div class="side-actions">
          <button id="restart-btn" class="btn" type="button">Restart</button>
          <button id="fs-btn" class="btn" type="button">Fullscreen</button>
        </div>
        <div>
          <h3>Controls</h3>
          <dl class="controls" id="p-controls"></dl>
        </div>
        <div>
          <h3>Play next</h3>
          <div class="next-list" id="next-list"></div>
        </div>
      </aside>
    </div>
  </section>

  <footer>
    <span>lowkey.arcade · all games are originals that run in your browser</span>
    <span>Scores are saved in this browser only.</span>
  </footer>
</div>

<script src="games-3.js?v=ed86ee81ac"></script>
<script>
(function () {
  'use strict';

  // ---------- Catalog ----------
  const ORDER = [
    'chassis', 'snowline', 'dead-signal', 'frontline', 'implode',
    'ripsaw', 'rail-gunner', 'purge-protocol', 'night-maw', 'junk-karts', 'cue-club', 'hoop-heat', 'knock-on',
    'assembly', 'fort-forge',
    'vault-run', 'trial-burn', 'breach', 'drop-zone', 'scrapfist', 'void-lancer', 'hardpoint', 'swarmbreaker',
    'span', 'rocket-yard',
    'dead-highway', 'long-shot', 'night-drift', 'deep-hunter',
    'grave-rounds', 'cutline', 'iron-bout', 'saltfire', 'hive-siege', 'fathom-six',
    'treadfire', 'mega-stomp', 'storm-probe', 'ore-drift', 'deep-cast',
    'raw-feed', 'scrap-derby', 'canyon-ace', 'skyline-run', 'reef-resort',
    'blockwild', 'fourth-and-long',
    'sky-circuit', 'hardlight', 'coaster-lab', 'cloud-climb',
    'arena-blitz', 'orbit-hopper', 'midnight-lanes', 'comet-tail',
    'beatline', 'putt-planet', 'puck-rush',
    'gem-shift', 'word-rain', 'crypt-crawler',
  ];
  // Library shelves, top to bottom. A game sits on the first shelf that lists it; the last shelf takes the rest.
  // Column counts are picked so each shelf fills its rows.
  const SHELVES = [
    { title: 'New', ids: ['chassis', 'snowline', 'dead-signal', 'frontline', 'implode', 'ripsaw', 'rail-gunner', 'purge-protocol'], cols: 4 },
    { title: 'Recently added', ids: ['night-maw', 'junk-karts', 'cue-club', 'hoop-heat', 'vault-run', 'trial-burn', 'breach', 'drop-zone', 'scrapfist', 'void-lancer', 'hardpoint', 'swarmbreaker'], cols: 4 },
    { title: 'Build & sim', ids: ['assembly', 'fort-forge', 'span', 'rocket-yard', 'coaster-lab', 'blockwild', 'reef-resort', 'ore-drift'], cols: 4 },
    { title: '3D', ids: ['dead-highway', 'long-shot', 'night-drift', 'deep-hunter', 'grave-rounds', 'cutline', 'iron-bout', 'saltfire', 'fathom-six', 'treadfire', 'mega-stomp', 'storm-probe', 'deep-cast', 'raw-feed', 'scrap-derby', 'canyon-ace', 'skyline-run', 'sky-circuit', 'hardlight', 'cloud-climb'], cols: 4 },
    { title: 'Arcade', ids: ['arena-blitz', 'orbit-hopper', 'midnight-lanes', 'comet-tail'], cols: 4 },
    { title: 'Sports & rhythm', ids: ['fourth-and-long', 'beatline', 'putt-planet', 'puck-rush'], cols: 4 },
    { title: 'Puzzle & strategy', ids: null, cols: 4 },   // hive-siege, gem-shift, word-rain, crypt-crawler, knock-on
  ];
  // Typical length of one run, shown on each card so players can pick something that fits the time they have.
  const RUN_LENGTH = {
    'chassis': '5–15 min',
    'snowline': '3–8 min',
    'dead-signal': '10–20 min',
    'frontline': '15–30 min',
    'implode': '2–5 min',
    'ripsaw': '10–20 min',
    'rail-gunner': '4–8 min',
    'purge-protocol': '5–10 min',
    'night-maw': '10–20 min',
    'junk-karts': '3–10 min',
    'cue-club': '5–10 min',
    'hoop-heat': '4–8 min',
    'knock-on': '1–3 min',
    'assembly': '15+ min',
    'fort-forge': '3–6 min',
    'vault-run': '3–8 min',
    'trial-burn': '1–3 min',
    'breach': '1–4 min',
    'drop-zone': '5–10 min',
    'scrapfist': '5–20 min',
    'void-lancer': '3–8 min',
    'hardpoint': '3–8 min',
    'swarmbreaker': '5–20 min',
    'span': '2–5 min',
    'rocket-yard': '5–15 min',
    'dead-highway': '2–8 min',
    'long-shot': '3–5 min',
    'night-drift': '2–4 min',
    'deep-hunter': '5–10 min',
    'grave-rounds': '10+ min',
    'cutline': '4–6 min',
    'iron-bout': '3–15 min',
    'saltfire': '5–10 min',
    'hive-siege': '15+ min',
    'fathom-six': '15–25 min',
    'treadfire': '5–15 min',
    'mega-stomp': '3–6 min',
    'storm-probe': '5–8 min',
    'ore-drift': '10+ min',
    'deep-cast': '10+ min',
    'raw-feed': '4–8 min',
    'scrap-derby': '3–5 min',
    'canyon-ace': '2–5 min',
    'skyline-run': '1–2 min',
    'reef-resort': '15+ min',
    'blockwild': '10+ min',
    'fourth-and-long': '8–15 min',
    'beatline': '1–2 min',
    'sky-circuit': '1–2 min',
    'hardlight': '4–10 min',
    'coaster-lab': '5–20 min',
    'cloud-climb': '8–15 min',
    'orbit-hopper': '1–3 min',
    'arena-blitz': '3–6 min',
    'gem-shift': '90 sec',
    'midnight-lanes': '1–3 min',
    'crypt-crawler': '5–15 min',
    'word-rain': '2–4 min',
    'putt-planet': '6–10 min',
    'comet-tail': '2–4 min',
    'puck-rush': '3–8 min',
  };

  const registry = (window.RECESS && Array.isArray(window.RECESS.games)) ? window.RECESS.games : [];
  const games = registry
    .filter((g) => g && typeof g.id === 'string' && typeof g.title === 'string' && typeof g.mount === 'function')
    .sort((a, b) => rank(a.id) - rank(b.id));
  const byId = new Map(games.map((g) => [g.id, g]));

  function rank(id) {
    const i = ORDER.indexOf(id);
    return i === -1 ? ORDER.length : i;
  }

  // ---------- Storage (per-viewer conveniences only) ----------
  const store = {
    get(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { window.localStorage.setItem(key, value); } catch (e) { /* storage blocked */ } },
  };
  function getBest(id) {
    const raw = store.get('recess:best:' + id);
    if (raw === null) return null;
    const v = parseFloat(raw);
    return Number.isFinite(v) ? v : null;
  }
  function fmt(n) {
    return Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  // ---------- Sound ----------
  let muted = store.get('recess:muted') === '1';
  let actx = null;
  let master = null;
  let noiseBuffer = null;
  let voices = 0;

  function audio() {
    if (muted) return null;
    try {
      if (!actx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        actx = new AC();
        master = actx.createGain();
        master.gain.value = 0.55;
        master.connect(actx.destination);
      }
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      return actx;
    } catch (e) {
      return null;
    }
  }

  function tone(freq, dur, opts) {
    try {
      const o = opts || {};
      if (!(freq > 0) || !(dur > 0) || voices > 24) return;
      const ctx = audio();
      if (!ctx) return;
      const t0 = ctx.currentTime + Math.max(0, o.delay || 0);
      const vol = Math.min(1, Math.max(0, o.vol == null ? 0.15 : o.vol)) * 0.5;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = o.type || 'square';
      osc.frequency.setValueAtTime(freq, t0);
      if (o.slide > 0) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t0 + Math.min(0.01, dur / 4));
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(master);
      voices++;
      osc.onended = () => { voices--; try { gain.disconnect(); } catch (e) { /* already gone */ } };
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (e) { /* sound is optional */ }
  }

  function noise(dur, opts) {
    try {
      const o = opts || {};
      if (!(dur > 0) || voices > 24) return;
      const ctx = audio();
      if (!ctx) return;
      if (!noiseBuffer) {
        noiseBuffer = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const t0 = ctx.currentTime + Math.max(0, o.delay || 0);
      const vol = Math.min(1, Math.max(0, o.vol == null ? 0.2 : o.vol)) * 0.6;
      const src = ctx.createBufferSource();
      src.buffer = noiseBuffer;
      src.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = o.filter > 0 ? o.filter : 1800;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(Math.max(vol, 0.0002), t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      voices++;
      src.onended = () => { voices--; try { gain.disconnect(); } catch (e) { /* already gone */ } };
      src.start(t0, Math.random() * 0.5);
      src.stop(t0 + dur + 0.03);
    } catch (e) { /* sound is optional */ }
  }

  const isTouch = (() => {
    try { return window.matchMedia('(hover: none) and (pointer: coarse)').matches; } catch (e) { return false; }
  })();

  // ---------- Elements ----------
  const $ = (id) => document.getElementById(id);
  const library = $('library');
  const player = $('player');
  const shelvesEl = $('shelves');
  const chips = $('chips');
  const search = $('search');
  const empty = $('empty');
  const stage = $('stage');
  const soundBtn = $('sound-btn');
  const fsBtn = $('fs-btn');

  let current = null;     // the game object on stage
  let instance = null;    // what its mount() returned
  let genre = 'All';
  let lastOpened = null;
  let mountSeq = 0;       // bumps on every unmount so a destroyed game's api.net.open() gets null

  // ---------- Library ----------
  const introTitle = $('intro-title');
  const em = document.createElement('em');
  em.textContent = 'No downloads.';
  introTitle.replaceChildren(games.length + ' games. ', em);

  const genres = ['All'].concat(Array.from(new Set(games.map((g) => g.genre || 'Arcade'))));
  genres.forEach((name) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = name;
    b.setAttribute('aria-pressed', String(name === genre));
    b.addEventListener('click', () => {
      genre = name;
      chips.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.textContent === name)));
      applyFilter();
    });
    chips.appendChild(b);
  });

  const shelves = SHELVES.map((s, i) => {
    const sec = document.createElement('section');
    sec.className = 'shelf';
    const h = document.createElement('h2');
    h.className = 'shelf-title';
    h.id = 'shelf-title-' + i;
    h.textContent = s.title;
    sec.setAttribute('aria-labelledby', h.id);
    const gridEl = document.createElement('div');
    gridEl.className = s.cols === 4 ? 'grid grid-4' : 'grid';
    sec.append(h, gridEl);
    shelvesEl.appendChild(sec);
    return { def: s, sec, grid: gridEl, ids: [] };
  });
  function shelfFor(id) {
    return shelves.find((s) => s.def.ids && s.def.ids.includes(id)) || shelves[shelves.length - 1];
  }

  const cards = new Map();
  games.forEach((g) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '#' + g.id;
    a.dataset.id = g.id;

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    thumb.appendChild(canvas);
    const sticker = document.createElement('span');
    sticker.className = 'sticker';
    sticker.textContent = (g.genre || 'Arcade') + (g.is3D ? ' · 3D' : '');
    thumb.appendChild(sticker);
    if (isOnline(g)) {
      const on = document.createElement('span');
      on.className = 'sticker sticker-net';
      on.textContent = 'Online';
      thumb.appendChild(on);
    }

    const body = document.createElement('div');
    body.className = 'card-body';
    const h = document.createElement('h3');
    h.textContent = g.title;
    const p = document.createElement('p');
    p.textContent = g.blurb || '';
    const meta = document.createElement('div');
    meta.className = 'meta';
    const run = document.createElement('span');
    run.textContent = (RUN_LENGTH[g.id] || '2–5 min') + ' runs';
    const best = document.createElement('span');
    best.className = 'best-chip';
    meta.append(run, best);
    body.append(h, p, meta);

    a.append(thumb, body);
    a.addEventListener('click', (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      openGame(g.id);
    });
    const shelf = shelfFor(g.id);
    shelf.grid.appendChild(a);
    shelf.ids.push(g.id);
    cards.set(g.id, { el: a, canvas, best });
    updateCardBest(g);
  });

  function updateCardBest(g) {
    const card = cards.get(g.id);
    if (!card) return;
    const b = getBest(g.id);
    card.best.textContent = b === null ? 'Not played yet' : 'Best ' + fmt(b);
    card.best.classList.toggle('has', b !== null);
  }

  function drawThumbs() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const queue = games.slice();
    const step = () => {
      const g = queue.shift();
      if (!g) return;
      const card = cards.get(g.id);
      if (card && typeof g.thumb === 'function') {
        const c = card.canvas;
        c.width = Math.round(480 * dpr);
        c.height = Math.round(300 * dpr);
        const ctx = c.getContext('2d');
        try {
          ctx.save();
          ctx.scale(dpr, dpr);
          g.thumb(ctx, 480, 300);
          ctx.restore();
        } catch (err) {
          console.error('[Recess] thumb failed for ' + g.id, err);
        }
      }
      setTimeout(step, 0);
    };
    step();
  }

  function applyFilter() {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    games.forEach((g) => {
      const hay = (g.title + ' ' + (g.blurb || '') + ' ' + (g.genre || '') + (g.is3D ? ' 3d' : '') + (isOnline(g) ? ' online multiplayer' : '')).toLowerCase();
      const ok = (genre === 'All' || g.genre === genre) && (!q || hay.includes(q));
      cards.get(g.id).el.hidden = !ok;
      if (ok) shown++;
    });
    shelves.forEach((s) => { s.sec.hidden = !s.ids.some((id) => !cards.get(id).el.hidden); });
    empty.hidden = shown > 0;
    if (!shown) {
      empty.textContent = q
        ? 'No games match “' + search.value.trim() + '”. Try a shorter word or pick All.'
        : 'No games in this genre yet.';
    }
  }
  search.addEventListener('input', applyFilter);

  $('random-btn').addEventListener('click', () => {
    const pool = games.filter((g) => !cards.get(g.id).el.hidden);
    const list = pool.length ? pool : games;
    if (!list.length) return;
    openGame(list[Math.floor(Math.random() * list.length)].id);
  });

  // ---------- Player ----------
  function makeApi(g) {
    const seq = mountSeq;
    return {
      isTouch,
      best: () => getBest(g.id),
      submit: (score) => {
        const s = Number(score);
        if (!Number.isFinite(s)) return false;
        const prev = getBest(g.id);
        // A first score of 0 is not worth celebrating; stroke counts are always above 0.
        const better = prev === null ? s > 0 : (g.lowerIsBetter ? s < prev : s > prev);
        if (better) {
          store.set('recess:best:' + g.id, String(s));
          updateCardBest(g);
          if (current === g) showBest(g, true);
        }
        return better;
      },
      tone,
      noise,
      // Per-game saved data (designs, tracks, ghosts, settings). Values are strings, capped at 200 KB.
      save: (key, value) => {
        const s = String(value);
        if (s.length > 200000) return false;
        try { window.localStorage.setItem('lowkey:data:' + g.id + ':' + key, s); return true; } catch (e) { return false; }
      },
      load: (key) => store.get('lowkey:data:' + g.id + ':' + key),
      // Shared audio context for music that must stay in time; null while sound is off.
      audio: () => {
        const ctx = audio();
        return ctx && master ? { ctx, out: master } : null;
      },
      // Online play (CONTRACT-NET.md). A stale api (from an earlier mount) always gets null.
      net: {
        supported: netSupported,
        open: (opts) => openNet(g, seq, opts),
      },
    };
  }

  function showBest(g, flash) {
    const el = $('p-best');
    const b = getBest(g.id);
    el.textContent = b === null ? 'None yet' : fmt(b);
    $('p-best-label').textContent = 'Your best · ' + (g.scoreLabel || 'Score') + (g.lowerIsBetter ? ' (lower wins)' : '');
    if (flash) {
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
    }
  }

  function fillSidebar(g) {
    $('p-title').textContent = g.title;
    $('p-genre').textContent = g.genre || 'Arcade';
    $('p-blurb').textContent = g.blurb || '';
    showBest(g, false);
    const netLine = $('p-net');
    if (netLine) {
      netLine.hidden = !isOnline(g);
      if (isOnline(g)) {
        $('p-net-text').textContent = netSupported
          ? 'Up to ' + netMax(g.online.maxPlayers) + ' players on different devices, with a room code.'
          : 'Not available in this browser.';
      }
    }

    const dl = $('p-controls');
    dl.textContent = '';
    (Array.isArray(g.controls) ? g.controls : []).forEach((row) => {
      const dt = document.createElement('dt');
      String(row[0] || '').split(' / ').forEach((key, i) => {
        if (i) dt.append(' ');
        const k = document.createElement('kbd');
        k.textContent = key;
        dt.appendChild(k);
      });
      const dd = document.createElement('dd');
      dd.textContent = row[1] || '';
      dl.append(dt, dd);
    });

    const next = $('next-list');
    next.textContent = '';
    const start = games.indexOf(g);
    for (let i = 1; i <= Math.min(3, games.length - 1); i++) {
      const n = games[(start + i) % games.length];
      const a = document.createElement('a');
      a.className = 'next-link';
      a.href = '#' + n.id;
      a.textContent = n.title;
      const tag = document.createElement('span');
      tag.textContent = n.genre || '';
      a.appendChild(tag);
      a.addEventListener('click', (e) => {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        openGame(n.id);
      });
      next.appendChild(a);
    }
  }

  function focusGame() {
    if (net && net.focus()) return;   // an open lobby keeps the keyboard (sound, fullscreen, first frame)
    const c = stage.querySelector('canvas');
    if (c) { try { c.focus({ preventScroll: true }); } catch (e) { /* focus is best effort */ } }
  }

  function unmount() {
    // A live lobby or session goes first, so the game still hears 'close' before destroy().
    netTeardown();
    mountSeq++;
    if (instance && typeof instance.destroy === 'function') {
      try { instance.destroy(); } catch (err) { console.error('[Recess] destroy failed for ' + (current && current.id), err); }
    }
    instance = null;
    stage.textContent = '';
  }

  function mountCurrent() {
    unmount();
    const g = current;
    if (!g) return;
    const root = document.createElement('div');
    root.className = 'root';
    stage.appendChild(root);
    addFsExit();
    try {
      instance = g.mount(root, makeApi(g)) || null;
    } catch (err) {
      console.error('[Recess] mount failed for ' + g.id, err);
      netTeardown();   // a lobby opened during the failed mount would otherwise keep swallowing keys
      stage.textContent = '';
      const box = document.createElement('div');
      box.className = 'stage-error';
      const strong = document.createElement('strong');
      strong.textContent = g.title + ' could not start.';
      const span = document.createElement('span');
      span.textContent = 'Press Restart to try again, or pick another game.';
      box.append(strong, span);
      stage.appendChild(box);
      addFsExit();
    }
    requestAnimationFrame(focusGame);
  }

  function openGame(id) {
    const g = byId.get(id);
    if (!g) return;
    exitFullscreen();
    current = g;
    lastOpened = id;
    fillSidebar(g);
    library.hidden = true;
    player.hidden = false;
    setHash(id);
    window.scrollTo(0, 0);
    mountCurrent();
  }

  function showLibrary() {
    exitFullscreen();
    unmount();
    current = null;
    player.hidden = true;
    library.hidden = false;
    setHash('');
    games.forEach(updateCardBest);
    const card = lastOpened && cards.get(lastOpened);
    if (card && !card.el.hidden) { try { card.el.focus({ preventScroll: false }); } catch (e) { /* best effort */ } }
  }

  function setHash(id) {
    try {
      history.replaceState(null, '', id ? '#' + id : location.pathname + location.search);
    } catch (e) { /* the viewer may not allow URL changes */ }
  }

  $('back-btn').addEventListener('click', showLibrary);
  $('home-link').addEventListener('click', (e) => { e.preventDefault(); showLibrary(); });
  $('restart-btn').addEventListener('click', () => {
    netTeardown(!!(instance && typeof instance.restart === 'function'));   // a remounted game is not woken
    if (instance && typeof instance.restart === 'function') {
      try { instance.restart(); } catch (err) { console.error('[Recess] restart failed', err); mountCurrent(); }
    } else {
      mountCurrent();
    }
    focusGame();
  });

  // ---------- Fullscreen ----------
  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; }
  function inFullscreen() { return fsElement() === stage || stage.classList.contains('pseudo-fs'); }
  function addFsExit() {
    const b = document.createElement('button');

  // ---------- Online play (room codes; see CONTRACT-NET.md) ----------

  // until both ends have that channel open. Star topology: the host relays.
  const NET_URL = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';

    unsupported: "This browser can't do online play. Try an up-to-date Chrome, Edge, Firefox or Safari.",
    noRoom: 'No room with that code. Check it with the host.',

    started: 'That match has already started.',
    version: 'That room is on a different version of the arcade. Everyone should reload the page.',
    noAnswer: "The room didn't answer. Check the code and try again.",
    hostLeft: 'The host closed the room.',
    kicked: 'The host removed you from the room.',
    lost: 'The connection to the room was lost.',

  const NET_PTRS = ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'click', 'dblclick', 'contextmenu', 'touchstart', 'touchmove', 'touchend', 'wheel'];
  const netSupported = (() => { try { return !!(window.RTCPeerConnection || window.webkitRTCPeerConnection); } catch (e) { return false; } })();

  function isOnline(g) { return !!(g && g.online && typeof g.online === 'object'); }

  function mkBtn(label, primary, fn, cls) {

  function netParse(raw) {

    // A link (host: one per guest, guest: one to the host) is
    // { conn, fast, fastOk, index, name, ping, seen, state: 'new'|'connecting'|'hello'|'in'|'gone', seq, err }.
    const c = {

    const title = mk('h2', 'net-title');

    ['keyup', 'keypress'].concat(NET_PTRS).forEach((t) => ov.addEventListener(t, stopEv, { passive: true }));

    later(() => { if (ov.parentNode && !ov.contains(document.activeElement)) focusFirst(); }, 0);
    return self;

    function stopEv(e) { e.stopPropagation(); }
    function onOvKey(e) {

    // A small stage (phones, narrow windows) gets the lobby over the whole viewport instead.

    function show(name, heading, nodes, focus, alt) {

    function label(text, extra) { const l = mk('div', 'net-label'); l.append(mk('span', null, text)); if (extra) l.append(extra); return l; }
    function row() { const r = mk('div', 'net-actions'); r.append.apply(r, arguments); return r; }
    function busyRow(text) { const r = mk('div', 'net-busy'); r.append(mk('span', 'net-spin'), status(text)); return r; }

    // ----- screens. Esc, Cancel, Leave and Back step back one screen; X, OK and Esc on the first one close.
    function back() {

    function showChoose() {
      c.role = '';
      const inp = Object.assign(mk('input', 'net-input'), { type: 'text', maxLength: 10, value: netNick, autocomplete: 'off', spellcheck: false });
      inp.setAttribute('autocapitalize', 'words');

    // Player rows: badge, name, host/you tags, ping, and a Remove button for the host.
    function setPing(el, ms) {

      el.textContent = ms > 0 ? ms + ' ms' : '\u2014';
      return el;
    }
    function fillList(list, me, cap, hostView) {

      ui.count.textContent = list.length + ' / ' + cap;

    // ----- host

      const p = newPeer('lowkey-' + g.id + '-' + code);

    function lobbyPlayers() {
      const seen = [];

        .concat(inGuests().map((x) => ({ index: x.index, name: x.name || 'Player ' + (x.index + 1), ping: x.ping })))
        .map((p) => {   // the same nickname twice gets a number
          let n = p.name;
          for (let k = 2; seen.indexOf(n.toLowerCase()) >= 0; k++) n = p.name.slice(0, 9 - String(k).length).trim() + ' ' + k;
          seen.push(n.toLowerCase());

        });
    }
    function pushLobby() {
      const tail = ',"max":' + max + ',"mode":' + JSON.stringify(mode) + ',"players":' + JSON.stringify(lobbyPlayers()) + '}';
      inGuests().forEach((x) => tx(x.conn, '{"t":"lobby","index":' + x.index + tail));
    }
    function hostConn(conn) {
      if (!conn || typeof conn.on !== 'function' || c.guests.length >= 16) { try { conn.close(); } catch (e) { /* closed */ } return; }
      const x = { conn, fast: null, fastOk: false, index: -1, name: '', ping: 0, seen: now(), state: 'new', seq: 0 };
      c.guests.push(x);
      later(() => { if (x.state === 'new') dropGuest(x); }, NET_WAIT);   // no hello in time
      conn.on('open', () => { if (x.state !== 'gone') openFast(x); });
      conn.on('data', (raw) => { if (x.state !== 'gone') hostData(x, raw); });
      conn.on('close', () => dropGuest(x));
    }
    function hostData(x, raw) {
      const d = netParse(raw);
      if (!d) return;
      x.seen = now();
      if (d.t === 'm') {
        if (x.state === 'in' && c.phase === 'session') emitMsg(d.d, x.index);
      } else if (d.t === 'ping') {
        const r = Number(d.r), t = Number(d.c);
        if (r >= 0 && r < 60000) x.ping = Math.round(r);
        tx(x.conn, '{"t":"pong","c":' + (isFinite(t) ? t : 0) + ',"h":' + now() + '}');
      } else if (d.t === 'fast') {
        x.fastOk = true;
      } else if (d.t === 'bye') {
        dropGuest(x);
      } else if (d.t === 'hello' && x.state === 'new') {
        const why = d.v !== 1 || d.game !== g.id ? 'version' : c.phase !== 'lobby' ? 'started' : inGuests().length + 1 >= max ? 'full' : '';
        if (why) { reject(x, why); return; }
        x.state = 'in';
        x.seq = ++c.seq;
        x.name = cleanNick(d.name, false);
        inGuests().forEach((y, i) => { y.index = i + 1; });
        tx(x.conn, JSON.stringify({ t: 'welcome', index: x.index, max, mode, players: lobbyPlayers() }));
        lobbyChanged();
        tone(880, 0.07, { type: 'triangle', vol: 0.12 });
      }
    }
    function reject(x, why) { tx(x.conn, '{"t":"reject","reason":"' + why + '"}'); cutGuest(x); }
    function kickGuest(index) {
      const x = inGuests().filter((y) => y.index === index)[0];
      if (c.phase !== 'lobby' || !x) return;
      tx(x.conn, '{"t":"kick"}');
      cutGuest(x);
      lobbyChanged();
    }
    function cutGuest(x) {   // forget a guest now, close its link a moment later so the last message gets out
      x.state = 'gone';
      if (c.guests.indexOf(x) >= 0) c.guests.splice(c.guests.indexOf(x), 1);
      killLater(null, [x]);
    }
    function dropGuest(x) {
      const was = x.state;
      if (was === 'gone') return;
      cutGuest(x);
      if (was !== 'in') return;
      if (c.phase === 'lobby') lobbyChanged();
      else if (c.phase === 'session') {
        c.byIndex[x.index] = null;
        c.players.forEach((p) => { if (p.index === x.index) p.connected = false; });
        c.guests.forEach((y) => { if (y.state === 'in') tx(y.conn, '{"t":"left","index":' + x.index + '}'); });
        emit('leave', x.index);
      }
    }
    function hostGo() {
      const ins = inGuests();
      if (c.phase !== 'lobby' || screen !== 'host' || !ins.length) return;
      // A link still opening is left alone: its hello gets the 'started' reject (cutting it now looks like a network error).
      c.guests.slice().forEach((x) => { if (x.state !== 'in' && x.conn.open) reject(x, 'started'); });
      c.players = lobbyPlayers().map((p) => ({ index: p.index, name: p.name, connected: true }));
      const tail = ',"h":' + now() + ',"players":' + JSON.stringify(c.players.map((p) => ({ index: p.index, name: p.name }))) + '}';
      ins.forEach((x) => { c.byIndex[x.index] = x; tx(x.conn, '{"t":"start","index":' + x.index + tail); });
      begin('host', 0);
    }

    // ----- guest
    function showJoin(code, err) {
      dropNet(true);
      c.role = '';
      const box = mk('div', 'net-code'), cells = [];
      for (let i = 0; i < 5; i++) {
        const b = Object.assign(mk('input', 'net-cell'), { type: 'text', value: code.charAt(i), autocomplete: 'off', spellcheck: false });
        b.setAttribute('autocapitalize', 'characters');
        b.setAttribute('autocorrect', 'off');
        b.setAttribute('aria-label', 'Room code, character ' + (i + 1) + ' of 5');
        cells.push(b);
        box.append(b);
      }
      const errP = mk('p', 'net-err'), join = mkBtn('Join', true, go), backB = mkBtn('Back', false, back);
      errP.setAttribute('role', 'alert');
      const empty = () => cells.filter((b) => !b.value)[0];
      const sync = () => { join.disabled = !!empty(); };
      const say = (t) => { errP.textContent = t; errP.hidden = !t; };
      const odd = (t) => say(/[01OIL]/i.test(t) ? 'Room codes never use 0, O, 1, I or L.' : '');
      const fill = (from, t) => {   // spread typed or pasted characters over the boxes
        const v = cleanCode(t);
        let i = from;
        for (let k = 0; k < v.length && i < 5; k++) cells[i++].value = v.charAt(k);
        if (v) focusEl(cells[Math.min(i, 4)]);
        sync();
      };
      cells.forEach((b, i) => {
        // Typing, pasting a whole code and phone autofill all arrive here (the boxes have no length limit).
        b.addEventListener('input', () => { const t = b.value; odd(t); b.value = ''; fill(i, t); });
        b.addEventListener('keydown', (e) => {
          const k = e.key, j = (k === 'ArrowLeft' || (k === 'Backspace' && !b.value)) ? i - 1 : k === 'ArrowRight' ? i + 1 : -1;
          if (k === 'Enter') { e.preventDefault(); go(); }
          else if (j >= 0 && j < 5) {
            e.preventDefault();
            if (k === 'Backspace') cells[j].value = '';
            focusEl(cells[j]);
            sync();
          }
        });
        b.addEventListener('focus', () => { try { b.select(); } catch (e) { /* not selectable */ } });
      });
      function go() {
        if (empty()) focusEl(empty());
        else joinRoom(cells.map((b) => b.value).join(''));
      }
      say(err);
      sync();
      show('join', 'Join a room', [label('Room code'), box, errP,
        mk('p', 'net-sub', 'Ask the host for the 5-character code on their screen.'), row(backB, join)], empty() || join);
    }
    function joinRoom(code) {
      saveNick();
      c.role = 'guest';
      // A new room has a new host clock: nothing measured against an earlier room may carry over.
      Object.assign(c, { code, ping: 0, offset: 0, bestRtt: 1e9, samples: 0, list: [], hostMode: '', hostMax: max });
      const gen = ++c.gen;
      showBusy('Joining room ' + code, 'Looking for the room...');
      loadPeer().then((ok) => {
        if (gen !== c.gen || c.phase !== 'lobby') return;
        if (ok) guestTry(gen, code, 0); else fail(NET_MSG.network);
      });
    }
    function guestTry(gen, code, tries) {
      const p = newPeer('lowkey-' + g.id + '-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36));
      if (!p) return;
      let opened = false;
      const mine = () => gen === c.gen && c.peer === p;
      later(() => { if (mine() && !opened) fail(NET_MSG.network); }, NET_WAIT);
      p.on('open', () => {
        if (!mine() || opened) return;
        opened = true;
        let conn = null;
        try { conn = p.connect('lowkey-' + g.id + '-' + code, { label: 'lowkey', serialization: 'raw', reliable: true }); } catch (e) { conn = null; }
        if (!conn || typeof conn.on !== 'function') { fail(NET_MSG.network); return; }
        const x = c.link = { conn, fast: null, fastOk: false, index: 0, ping: 0, seen: now(), state: 'connecting', err: false };
        // No 'open' in time: the room exists but WebRTC cannot get through this network.
        later(() => { if (mine() && x.state === 'connecting') fail(NET_MSG.network); }, NET_WAIT);
        conn.on('open', () => {
          if (!mine() || c.link !== x || x.state !== 'connecting') return;
          x.state = 'hello';
          x.seen = now();
          openFast(x);
          tx(conn, JSON.stringify({ t: 'hello', v: 1, game: g.id, name: c.nick }));
          later(() => { if (mine() && x.state === 'hello') showJoin(code, NET_MSG.noAnswer); }, NET_WAIT);
        });
        conn.on('data', (raw) => { if (mine() && c.link === x) guestData(x, raw); });
        conn.on('close', () => { if (mine() && c.link === x) linkDown(x, false); });
        conn.on('error', () => { x.err = true; });
      });
      p.on('error', (err) => {
        const type = err && err.type, x = c.link;
        if (!mine()) return;
        if (type === 'unavailable-id' && !opened && tries < 3) { c.gen++; c.peer = null; killLater(p, []); guestTry(c.gen, code, tries + 1); }
        else if (type === 'peer-unavailable') { if (!x || x.state === 'connecting') showJoin(code, NET_MSG.noRoom); }
        else if (!x || x.state === 'connecting') fail(type === 'browser-incompatible' ? NET_MSG.unsupported : NET_MSG.network);
        // once linked to the host, PeerJS server trouble does not matter
      });
    }
    function guestData(x, raw) {
      const d = netParse(raw), t = d && d.t;
      if (!d) return;
      x.seen = now();
      if (t === 'm') {
        if (c.phase === 'session') emitMsg(d.d, 0);
      } else if (t === 'pong') {
        pong(d);
      } else if (t === 'fast') {
        x.fastOk = true;
      } else if (c.phase === 'lobby' && (t === 'welcome' ? x.state === 'hello' : t === 'lobby' && x.state === 'in')) {
        const me = netInt(d.index, 1, 7);
        if (me < 0) return;
        x.index = me;
        c.list = cleanList(d.players);
        c.hostMax = netMax(d.max);
        c.hostMode = cleanLabel(d.mode);
        if (t === 'lobby') { renderWait(); return; }
        x.state = 'in';
        c.tick = c.tick || setInterval(tick, NET_PING);
        tick();
        showWait();
      } else if (t === 'reject') {
        if (c.phase === 'lobby' && x.state === 'hello') showJoin(c.code, NET_MSG[d.reason === 'full' || d.reason === 'started' ? d.reason : 'version']);
      } else if (t === 'start') {
        const me = netInt(d.index, 1, 7), list = cleanList(d.players), h = Number(d.h);
        if (c.phase !== 'lobby' || x.state !== 'in') return;
        if (!list.some((p) => p.index === me)) { fail(NET_MSG.lost, 'Connection lost'); return; }
        x.index = me;
        c.players = list.map((p) => ({ index: p.index, name: p.name, connected: true }));
        if (!c.samples && isFinite(h)) c.offset = h - now();
        begin('guest', me);
      } else if (t === 'left') {
        const i = netInt(d.index, 1, 7), pl = c.players.filter((p) => p.index === i)[0];
        if (c.phase === 'session' && pl && pl.connected && i !== x.index) { pl.connected = false; emit('leave', i); }
      } else if (t === 'kick' || t === 'bye') {
        if (c.phase === 'session') end(t === 'kick' ? 'kicked' : 'host-left');
        else if (t === 'kick') fail(NET_MSG.kicked, 'Removed from the room');
        else fail(NET_MSG.hostLeft, 'Room closed');
      }
    }
    function cleanList(arr) {
      const out = [];
      (Array.isArray(arr) ? arr.slice(0, 8) : []).forEach((p) => {
        const i = p && typeof p === 'object' ? netInt(p.index, 0, 7) : -1, r = Number(i >= 0 && p.ping);
        if (i >= 0 && !out.some((q) => q.index === i)) out.push({ index: i, name: cleanNick(p.name, false) || 'Player ' + (i + 1), ping: r >= 0 && r < 60000 ? Math.round(r) : 0 });
      });
      return out.sort((a, b) => a.index - b.index);
    }
    function pong(d) {
      const t = now(), rtt = t - Number(d.c), h = Number(d.h);
      if (!(rtt >= 0 && rtt < 30000) || !isFinite(h)) return;
      c.ping = Math.round(rtt);
      if (c.session) c.session.ping = c.ping;
      // Host clock = local clock + offset, taken from the quickest round trips (the least queueing).
      c.bestRtt += 2;
      if (!c.samples || rtt <= c.bestRtt * 1.25 + 4) {
        c.offset = c.samples ? c.offset + (h + rtt / 2 - t - c.offset) * 0.5 : h + rtt / 2 - t;
        c.bestRtt = Math.min(c.bestRtt, rtt);
      }
      c.samples++;
      renderWait();
    }
    function showWait() {
      const count = mk('span', 'net-count'), list = mk('ul', 'net-list'), info = mk('p', 'net-sub'), leave = mkBtn('Leave', false, back);
      show('wait', 'You are in room ' + c.code, [busyRow('Joined. Waiting for the host to start...'), label('Players', count), list, info, row(leave)], leave);
      Object.assign(ui, { count, list, info });
      renderWait();
    }
    function renderWait() {
      if (screen !== 'wait' || !c.link) return;
      ui.info.textContent = c.hostMode ? 'Mode: ' + c.hostMode : '';
      ui.info.hidden = !c.hostMode;
      fillList(c.list, c.link.index, c.hostMax, false);
    }
    function linkDown(x, timedOut) {
      // A close right after missed pongs is a network problem, not the host leaving.
      const lost = timedOut || x.err || now() - x.seen > NET_PING * 1.6;
      if (c.phase === 'session') end(lost ? 'connection-lost' : 'host-left');
      else if (x.state === 'hello') showJoin(c.code, NET_MSG.noAnswer);
      else if (lost) fail(NET_MSG.lost, 'Connection lost');
      else fail(NET_MSG.hostLeft, 'Room closed');
    }

    // ----- both ends
    function openFast(x) {   // negotiated: both ends create it with the same id, no extra signalling
      try {
        const ch = x.conn.peerConnection.createDataChannel('lowkey-fast', { negotiated: true, id: NET_FAST_ID, ordered: false, maxRetransmits: 0 });
        ch.onopen = () => { if (x.state !== 'gone') tx(x.conn, '{"t":"fast"}'); };
        ch.onmessage = (e) => {
          let m = null;
          if (x.state !== 'in' || c.phase !== 'session' || typeof e.data !== 'string' || e.data.length > NET_MAX) return;
          try { m = JSON.parse(e.data); } catch (err) { return; }
          x.seen = now();
          emitMsg(m, c.role === 'host' ? x.index : 0);
        };
        x.fast = ch;
      } catch (e) { x.fast = null; }   // no negotiated channels here: the reliable link carries everything
    }
    function tick() {   // every 2 s: guests ping, quiet links are dropped, the host refreshes the lobby
      const t = now();
      if (c.role === 'host') {
        c.guests.slice().forEach((x) => { if (x.state === 'in' && t - x.seen > NET_LOST) dropGuest(x); });
        if (c.phase === 'lobby') { pushLobby(); renderHost(); }
      } else if (c.link && c.link.state === 'in') {
        if (t - c.link.seen > NET_LOST) linkDown(c.link, true);
        else tx(c.link.conn, '{"t":"ping","c":' + t + ',"r":' + c.ping + '}');
      }
    }
    // Close links and the peer: right away, or a moment later when a goodbye was just sent.
    function killLater(p, links) {
      setTimeout(() => {
        links.forEach((x) => {
          try { if (x.fast) { x.fast.onopen = x.fast.onmessage = null; x.fast.close(); } } catch (e) { /* gone */ }
          try { x.conn.close(); x.conn.removeAllListeners(); } catch (e) { /* gone */ }
        });
        try { if (p) { p.destroy(); p.removeAllListeners(); } } catch (e) { /* gone */ }
      }, links.length ? 250 : 0);
    }
    function dropNet(bye) {
      const links = c.guests.concat(c.link ? [c.link] : []), p = c.peer;
      c.gen++;
      clearInterval(c.tick);
      c.timers.forEach((id) => clearTimeout(id));
      Object.assign(c, { tick: 0, timers: [], guests: [], link: null, byIndex: [], peer: null });
      links.forEach((x) => {
        if (bye && x.state !== 'gone') tx(x.conn, '{"t":"bye"}');
        x.state = 'gone';
      });
      if (p || links.length) killLater(p, links);
    }
    function finish(refocus) {
      dropNet(true);
      c.phase = 'dead';
      if (net === self) net = null;
      closeOverlay(refocus);
    }
    function quit() {   // cancelled, or a failure was dismissed: resolve null
      if (c.phase !== 'lobby') return;
      finish(true);
      const r = resolve;
      resolve = null;
      if (r) r(null);
    }
    function teardown(alive) {   // the hub is unmounting the game, or restarting it (alive)
      if (c.phase === 'session') end('closed');
      else if (c.phase === 'lobby') {
        finish(false);
        const r = resolve;
        resolve = null;
        if (alive && r) r(null);   // a destroyed game is left pending, so a late null cannot wake it
      }
    }

    // ----- session
    function begin(role, me) {
      c.phase = 'session';
      screen = '';
      c.L = { message: [], leave: [], close: [] };
      const s = c.session = {
        role,
        me,
        players: c.players,
        ping: role === 'host' ? 0 : c.ping,
        hostTime: () => (role === 'host' ? now() : now() + c.offset),
        send: (msg, opts) => {
          const x = role === 'host' ? (opts ? c.byIndex[opts.to] : null) : c.link;
          const str = c.phase === 'session' && x && x.state === 'in' ? enc(msg) : null;
          return str !== null && put(x, str, !!(opts && opts.fast));
        },
        broadcast: (msg, opts) => bcast(msg, !!(opts && opts.fast), opts ? opts.except : -1),
        relay: (msg, from, opts) => bcast(msg, !!(opts && opts.fast), from),   // host: pass a guest's message on to the others
        on: (type, fn) => {
          const a = c.L && c.L[type];
          if (a && typeof fn === 'function' && a.indexOf(fn) < 0) {
            c.L[type] = a.concat([fn]);   // copy on write, so emitting never allocates
            if (type === 'message' && c.queue.length && !c.flushT) c.flushT = setTimeout(flush, 0);
          }
          return s;
        },
        off: (type, fn) => {
          const a = c.L && c.L[type];
          if (a && a.indexOf(fn) >= 0) c.L[type] = a.filter((f) => f !== fn);
          return s;
        },
        close: () => { end('closed'); },
      };
      closeOverlay(true);
      tone(660, 0.08, { type: 'triangle', vol: 0.14 });
      tone(990, 0.1, { type: 'triangle', vol: 0.14, delay: 0.08 });
      const r = resolve;
      resolve = null;
      if (r) r(s);
    }
    function enc(msg) {
      let str = null;
      try { str = JSON.stringify(msg); } catch (e) { /* cyclic */ }
      if (typeof str === 'string' && str.length <= NET_MAX) return str;
      if (!c.warned) { c.warned = true; console.warn('[Recess] online message dropped: not JSON or over 16 KB'); }
      return null;
    }
    function put(x, str, fast) {
      const ch = x.fast;
      if (!fast || !x.fastOk || !ch || ch.readyState !== 'open') return tx(x.conn, '{"t":"m","d":' + str + '}');
      try { if (ch.bufferedAmount < 65536) ch.send(str); } catch (e) { /* lost, like any fast message */ }
      return true;
    }
    function bcast(msg, fast, except) {
      const str = c.phase === 'session' && c.role === 'host' ? enc(msg) : null;
      if (str === null) return false;
      for (let i = 1; i < c.byIndex.length; i++) {
        const x = c.byIndex[i];
        if (x && x.state === 'in' && (Array.isArray(except) ? except.indexOf(i) < 0 : i !== except)) put(x, str, fast);
      }
      return true;
    }
    // Messages that arrive before the game listens are held, in order, until it does.
    function emitMsg(msg, from) {
      if (c.phase !== 'session' || !msg || typeof msg !== 'object') return;
      if (c.L.message.length && !c.queue.length) { emit('message', msg, from); return; }
      if (c.queue.length < 400) c.queue.push(msg, from);
      if (c.L.message.length && !c.flushT) c.flushT = setTimeout(flush, 0);
    }
    function flush() {
      const q = c.queue;
      c.flushT = 0;
      c.queue = [];
      for (let i = 0; i < q.length && c.phase === 'session'; i += 2) {
        if (!c.L.message.length) { c.queue = q.slice(i).concat(c.queue); return; }
        emit('message', q[i], q[i + 1]);
      }
    }
    function emit(type, a1, a2) {
      const a = c.L[type];
      for (let i = 0; i < a.length && c.phase === 'session'; i++) {
        try { a[i](a1, a2); } catch (err) { console.error('[Recess] online ' + type + ' handler failed', err); }
      }
    }
    function end(reason) {   // 'close' fires exactly once
      if (c.phase !== 'session') return;
      const a = c.L.close;
      clearTimeout(c.flushT);
      finish(false);
      c.queue = [];
      c.L = null;
      a.forEach((fn) => { try { fn(reason); } catch (err) { console.error('[Recess] online close handler failed', err); } });
    }
  }

  // ---------- Boot ----------
  function start(data) {
    drawThumbs();
    applyFilter();
    const fromHash = decodeURIComponent((location.hash || '').slice(1));
    const id = (data && data.game && byId.has(data.game)) ? data.game : fromHash;
    if (byId.has(id)) openGame(id);
  }

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(() => ({ game: current ? current.id : null })); } catch (e) { /* optional */ }
  }
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});
})();

</script>

</body>
