<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Lowkey Arcade · discovery probe</title>
<style>body{margin:0;padding:24px;background:#0d1017;color:#e6e9f2;font:15px/1.5 system-ui,sans-serif}p{color:#9aa3b8;max-width:640px}td{padding:6px 14px 6px 0;border-bottom:1px solid #232a3b}.PASS{color:#5ee0a0}.FAIL{color:#ff7a7a}pre{background:#151a26;padding:12px;white-space:pre-wrap;word-break:break-all}button{font:inherit;background:#222a3d;color:inherit;border:1px solid #39425a;border-radius:8px;padding:8px 14px}</style></head><body>
<h1>Public rooms: discovery probe</h1>
<p id="msg">Checks that the PeerJS cloud server passes on the small messages public rooms use. Takes under 10 seconds (about 30 if something fails).</p>
<table id="tbl"></table><pre id="result">{}</pre><button id="pc">PC cap test (optional)</button>
<script>
(function(){var R={v:2},W={},rows={},P=[],h=location.hash,far=/^#b=(lowkey-pubT-[a-z0-9]{6})$/.exec(h),live=1;function $(i){return document.getElementById(i)}function rnd(){return'lowkey-pubT-'+(Math.random().toString(36)+'000000').slice(2,8)}function row(k,l,s,v){var r=rows[k];if(!r){r=rows[k]=$('tbl').insertRow();r.insertCell().textContent=l;r.insertCell();r.insertCell()}r.cells[1].textContent=s;r.cells[1].className=s;r.cells[2].textContent=v||''}function show(){$('result').textContent=JSON.stringify(R,null,1)}function room(n){return{t:'room',v:1,s:0,g:'probe',c:'ABCDE',n:'Probe',p:1,m:8,md:'Race · 2–3',a:n}}function send(p,d,lk){p.socket.send({type:'CANDIDATE',dst:d,payload:{candidate:{candidate:'',sdpMid:'0',sdpMLineIndex:0},type:'data',connectionId:'lk',lk:lk}})}function key(o){return JSON.stringify(o,Object.keys(o||0).sort())}function ok(v){return v>=0&&v<2000}function ms(v){return v<0?'none':v}function sec(v){return v<0?'none':(v/1000).toFixed(1)}function peer(cb){var p=new Peer(rnd(),{debug:0}),done=0;P.push(p);function end(x){if(!done){done=1;cb(x)}}p.on('open',function(){end(p)});p.on('error',function(e){var t=String(e&&e.type);if(t=='network'&&live)R.sock='closed';if(!done){R.err=t;show();end(null)}});p.on('disconnected',function(){if(live)R.sock='closed'});setTimeout(end,15000,null)}function listen(p){p.socket.on('message',function(m){var x=m&&m.payload,lk=x&&x.connectionId=='lk'&&x.lk,k=m.type==='EXPIRE'?'x'+m.src:lk?(lk.t==='room'?'r'+lk.a:lk.t+lk.n):'';if(p.isA&&lk&&lk.t==='probe')send(p,m.src,room(lk.n));if(W[k])W[k](lk)})}function ask(p,k,d,lk,wait,cb){var t=performance.now(),on=1;W[k]=function(g){if(on){on=0;delete W[k];cb(Math.round(performance.now()-t),g)}};setTimeout(function(){if(on){on=0;delete W[k];cb(-1)}},wait);send(p,d,lk)}function B(aid){peer(function(b){if(!b)return fail();row('srv','PeerJS server','PASS','connected');listen(b);var n=Math.floor(Math.random()*1e9);ask(b,'echo'+n,b.id,{t:'echo',v:1,n:n},5000,function(t){R.echo=t;row('e','Self-echo (under 2 s)',ok(t)?'PASS':'FAIL',ms(t)+' ms');R.reply=[];R.payload='ok';(function next(i){if(i>2)return exp();var q=Math.floor(Math.random()*1e9);ask(b,'r'+q,aid,{t:'probe',v:1,n:q},5000,function(t,g){R.reply.push(t);if(key(g)!==key(room(q)))R.payload='bad';setTimeout(next,300,i+1)})})(0)});function exp(){row('r','Replies from tab A (under 2 s)',R.reply.every(ok)?'PASS':'FAIL',R.reply.map(ms).join(', ')+' ms');row('p','Payload arrives intact',R.payload==='ok'?'PASS':'FAIL',R.payload);R.expire=[];for(var i=0;i<3;i++){var id=rnd();ask(b,'x'+id,id,{t:'probe',v:1,n:i},9000,function(t){if(R.expire.push(t)===3)fin()})}}})}function fin(){var x=R.expire,xo=x.every(function(v){return v>=0&&v<=8000}),so=!R.sock;live=0;R.sock=R.sock||'open';row('x','Unused ids expire (under 8 s)',xo?'PASS':'FAIL',x.map(sec).join(', ')+' s');row('k','Socket stays open',so?'PASS':'FAIL',R.sock);R.pass=ok(R.echo)&&R.reply.every(ok)&&R.payload==='ok'&&xo&&so;R.line='pubprobe v2 echo='+ms(R.echo)+'ms reply='+R.reply.map(ms).join(',')+'ms payload='+R.payload+' expire='+x.map(sec).join(',')+'s sock='+R.sock;row('g','Release gate',R.pass?'PASS':'FAIL',R.pass?'public rooms can ship':'keep PUB_ON = false');$('msg').textContent='Done. Copy this line and send it back: '+R.line;show();P.forEach(function(p){try{p.destroy()}catch(e){}})}function fail(){row('srv','PeerJS server','FAIL','could not connect');R.line='pubprobe v2 server=unreachable';show()}function start(){R.mode=h==='#a'?'A':far?'B':'one tab';if(far)return B(far[1]);peer(function(a){if(!a)return fail();a.isA=1;listen(a);if(h!=='#a')return B(a.id);row('a','Tab A answering as','PASS',a.id);$('msg').textContent='Keep this tab open. On the other device, open this page with #b='+a.id+' at the end of the address.'})}var s=document.createElement('script'),J='PeerJS 1.5.4 script';s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';s.onload=function(){if(!window.Peer)return s.onerror();row('js',J,'PASS','loaded');start()};s.onerror=function(){row('js',J,'FAIL','blocked on this network');R.line='pubprobe v2 script=blocked';show()};row('js',J,'wait','loading...');document.head.appendChild(s);$('pc').onclick=function(){var i=0;try{for(;i<600;i++)new RTCPeerConnection().close()}catch(e){}R.pcCap=i;row('pc','PC cap test',i===600?'PASS':'FAIL',i+' of 600 made');show()}})();
</script>
</body></html>
